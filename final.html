<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple TV 4K Launcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            color: white;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000000;
        }

        /* Background Layer */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0f;
            background-size: cover;
            background-position: center;
            transition: background-image 1.5s ease-in-out;
            filter: brightness(0.85);
            z-index: 1;
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.85) 100%);
            z-index: 2;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .top-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .greeting {
            font-size: 18px;
            font-weight: 300;
            opacity: 0.9;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .clock {
            font-size: 54px;
            font-weight: 200;
            letter-spacing: -1px;
            line-height: 1.1;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .date {
            font-size: 15px;
            font-weight: 300;
            opacity: 0.8;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
        }

        .pill-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .pill-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
            outline: none;
        }

        /* Dropdowns */
        .dropdown-menu {
            position: absolute;
            top: 60px;
            right: 0;
            background: rgba(25, 25, 25, 0.9);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            width: 220px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .dropdown-menu.active {
            display: flex;
        }

        .dropdown-item {
            padding: 14px 18px;
            font-size: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .middle-spacer {
            flex: 1;
        }

        /* Dock Section */
        .dock-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .dock-app-name {
            font-size: 26px;
            font-weight: 500;
            min-height: 35px;
            text-align: center;
            transition: color 0.2s;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .dock-wrapper {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 16px 24px;
            display: flex;
            gap: 24px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .dock-item {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 500;
            z-index: 2;
            cursor: pointer;
        }

        .glass-highlight {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            pointer-events: none;
            transition: all 0.18s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 3;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* All Apps Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(25px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: rgba(30, 30, 35, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            width: 700px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
        }

        .all-apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-height: 350px;
            overflow-y: auto;
        }

        .app-grid-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .app-grid-card:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="bg-container" id="bgContainer"></div>
    <div class="bg-overlay"></div>

    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-left">
                <div class="greeting" id="greeting">Good Evening</div>
                <div class="clock" id="clock">9:41 PM</div>
                <div class="date" id="date">Monday, October 26</div>
            </div>
            <div class="top-right">
                <button class="pill-btn" onclick="toggleDropdown('inputsDropdown')">Inputs</button>
                <div class="dropdown-menu" id="inputsDropdown">
                    <div class="dropdown-item" onclick="selectInput('HDMI 1')">HDMI 1</div>
                    <div class="dropdown-item" onclick="selectInput('HDMI 2')">HDMI 2</div>
                    <div class="dropdown-item" onclick="selectInput('AV Port')">AV / Composite</div>
                    <div class="dropdown-item" onclick="selectInput('Live TV')">Live TV</div>
                </div>

                <button class="pill-btn" id="btnWifi" onclick="toggleDropdown('wifiDropdown')">Wi-Fi: Home_Fiber_5G</button>
                <div class="dropdown-menu" id="wifiDropdown">
                    <div class="dropdown-item" onclick="selectWifi('Home_Fiber_5G')">✓ Home_Fiber_5G</div>
                    <div class="dropdown-item" onclick="selectWifi('Tiruppur_JVS_Net')">Tiruppur_JVS_Net</div>
                    <div class="dropdown-item" onclick="selectWifi('Guest_Network')">Guest_Network</div>
                </div>

                <button class="pill-btn" onclick="alert('Opening Settings')">Settings</button>
            </div>
        </div>

        <div class="middle-spacer"></div>

        <!-- Dock Section -->
        <div class="dock-container">
            <div class="dock-app-name" id="dockAppName">Netflix</div>
            <div class="dock-wrapper" id="dockWrapper">
                <div class="glass-highlight" id="glassHighlight"></div>
                <div class="dock-item" data-name="Netflix" data-color="#e50914" onclick="openApp('Netflix')">🎬 Netflix</div>
                <div class="dock-item" data-name="YouTube" data-color="#ff0000" onclick="openApp('YouTube')">▶️ YouTube</div>
                <div class="dock-item" data-name="VLC Player" data-color="#ff9500" onclick="openApp('VLC Player')">🎵 VLC</div>
                <div class="dock-item" data-name="All Apps" data-color="#34c759" onclick="toggleAllApps(true)">🗂️ All Apps</div>
            </div>
        </div>
    </div>

    <!-- All Apps Modal -->
    <div class="modal-overlay" id="allAppsModal" onclick="if(event.target === this) toggleAllApps(false)">
        <div class="modal-content">
            <div class="modal-title">All Applications</div>
            <div class="all-apps-grid" id="allAppsGrid"></div>
        </div>
    </div>

    <script>
        // Google Drive ஆட்டோ-பெட்ச் லிங்க்
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxrH08z1o6aU1rM8kM1hrfkZZl4ndO7PUEs22sJBAFfljv9YpTs5-aQMb19_cjzT9Wk3w/exec';

        let wallpapers = [];
        let currentImgIdx = 0;
        const bgContainer = document.getElementById('bgContainer');

        async function fetchDriveWallpapers() {
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                if (data && data.length > 0) {
                    wallpapers = data;
                    changeBackground();
                }
            } catch (error) {
                console.error('Error fetching wallpapers:', error);
                wallpapers = ['https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1920&auto=format&fit=crop&q=80'];
            }
        }

        function changeBackground() {
            if (wallpapers.length === 0) return;
            bgContainer.style.backgroundImage = `url('${wallpapers[currentImgIdx]}')`;
            currentImgIdx = (currentImgIdx + 1) % wallpapers.length;
        }

        fetchDriveWallpapers();
        setInterval(changeBackground, 10000);

        // Clock & Greeting
        function updateTime() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes().toString().padStart(2, '0');
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock').innerText = `${h}:${m} ${ampm}`;

            let greet = "Good Morning";
            if (now.getHours() >= 12 && now.getHours() < 17) greet = "Good Afternoon";
            else if (now.getHours() >= 17) greet = "Good Evening";
            document.getElementById('greeting').innerText = greet;

            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateTime, 1000);
        updateTime();

        function toggleDropdown(id) {
            document.querySelectorAll('.dropdown-menu').forEach(m => {
                if(m.id !== id) m.classList.remove('active');
            });
            document.getElementById(id).classList.toggle('active');
        }

        function selectInput(name) {
            alert("Switching input framework to: " + name);
            document.getElementById('inputsDropdown').classList.remove('active');
        }

        function selectWifi(name) {
            document.getElementById('btnWifi').innerText = "Wi-Fi: " + name.replace('✓ ', '');
            document.getElementById('wifiDropdown').classList.remove('active');
        }

        // Dock Highlight
        const highlight = document.getElementById('glassHighlight');
        const dockItems = document.querySelectorAll('.dock-item');
        const dockAppName = document.getElementById('dockAppName');

        function updateHighlight(index) {
            const item = dockItems[index];
            highlight.style.width = item.offsetWidth + 'px';
            highlight.style.height = item.offsetHeight + 'px';
            highlight.style.left = item.offsetLeft + 'px';
            highlight.style.top = item.offsetTop + 'px';

            const appName = item.getAttribute('data-name');
            const color = item.getAttribute('data-color');
            dockAppName.innerText = appName;
            dockAppName.style.color = color;
            dockAppName.style.textShadow = `0 0 20px ${color}88`;
        }
        updateHighlight(0);

        // All Apps
        const allAppsList = [
            { name: "Prime Video", icon: "📺" },
            { name: "Disney+", icon: "✨" },
            { name: "JioCinema", icon: "🏏" },
            { name: "SonyLIV", icon: "🎯" },
            { name: "Zee5", icon: "💎" },
            { name: "Spotify", icon: "🎧" },
            { name: "File Manager", icon: "📁" },
            { name: "Settings", icon: "⚙️" },
            { name: "Play Store", icon: "🛍️" }
        ];

        const gridEl = document.getElementById('allAppsGrid');
        allAppsList.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-grid-card';
            card.innerHTML = `<span style="font-size:28px;">${app.icon}</span><span style="font-size:16px; font-weight:500;">${app.name}</span>`;
            card.onclick = () => { alert("Opening " + app.name); toggleAllApps(false); };
            gridEl.appendChild(card);
        });

        function toggleAllApps(show) {
            const modal = document.getElementById('allAppsModal');
            if(show) modal.classList.add('active');
            else modal.classList.remove('active');
        }

        function openApp(name) {
            if(name === 'All Apps') toggleAllApps(true);
            else alert("Launching " + name);
        }
    </script>
</body>
</html>
